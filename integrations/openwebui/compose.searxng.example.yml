services:
  open-webui:
    image: local/open-webui:v0.11.3-bmf-web-v1
    depends_on:
      - searxng
    environment:
      - ENABLE_WEB_SEARCH=True
      - ENABLE_WEB_SEARCH_CONFIRMATION=True
      - WEB_SEARCH_ENGINE=searxng
      - WEB_SEARCH_RESULT_COUNT=5
      - WEB_SEARCH_CONCURRENT_REQUESTS=1
      - 'WEB_SEARCH_DOMAIN_FILTER_LIST=["bundesfinanzministerium.de","gesetze-im-internet.de","bundesfinanzhof.de","bundesverfassungsgericht.de","rechtsprechung-im-internet.de","bundesgesetzblatt.de","bundestag.de","bundesrat.de","eur-lex.europa.eu","curia.europa.eu"]'
      - WEB_FETCH_FILTER_LIST=bundesfinanzministerium.de,gesetze-im-internet.de,bundesfinanzhof.de,bundesverfassungsgericht.de,rechtsprechung-im-internet.de,bundesgesetzblatt.de,bundestag.de,bundesrat.de,eur-lex.europa.eu,curia.europa.eu
      - WEB_FETCH_MAX_CONTENT_LENGTH=200000
      - WEB_LOADER_CONCURRENT_REQUESTS=2
      - USER_AGENT=Steuerreport-V2-Research/1.0
      - SEARXNG_QUERY_URL=http://searxng:8080/search
      - SEARXNG_LANGUAGE=de-DE

  searxng:
    image: docker.io/searxng/searxng@sha256:REPLACE_WITH_VERIFIED_DIGEST
    container_name: searxng
    restart: unless-stopped
    expose:
      - "8080"
    mem_limit: 1g
    cpus: 2.0
    volumes:
      - /opt/searxng:/etc/searxng:rw
