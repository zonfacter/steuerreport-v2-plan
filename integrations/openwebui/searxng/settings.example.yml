use_default_settings: true

general:
  debug: false
  instance_name: "OpenWebUI Local Search"

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "de"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "REPLACE_WITH_64_HEX_CHARACTERS"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
