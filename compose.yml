services:
  steuerreport:
    build: .
    image: steuerreport-v2:0.2.0rc39
    ports:
      - "127.0.0.1:${STEUERREPORT_PORT:-8010}:8010"
    volumes:
      - steuerreport-data:/state
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  steuerreport-data:
