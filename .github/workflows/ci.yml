name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.11
          python -m pip install pytest-xdist==3.8.0
          python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Private account defaults
        run: python scripts/check_private_data_v2.py
      - name: Unit tests
        run: >-
          pytest tests/unit -n 2 --dist loadfile -q
          --basetemp="${RUNNER_TEMP}/steuerreport-tests"
          -o tmp_path_retention_policy=failed
          -o tmp_path_retention_count=1
      - name: OpenAPI contract drift
        run: python scripts/export_openapi_v2.py --check
      - name: Endpoint reference drift
        run: python scripts/generate_api_endpoint_reference_v2.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
