name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reference-acceptance:
    name: Mandatory independent reference gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked reference-test dependencies
        run: python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - name: Immutable independent reference probes
        env:
          PYTHONPATH: src
        run: |
          python scripts/check_reference_baseline_v2.py
          python -m pytest docs/audit/2026-10-28/acceptance_tests.py -q --junitxml=reference-original.xml
      - name: Independent FX, identity and lot-origin probes
        env:
          PYTHONPATH: src
          STEUERREPORT_TEST_PRUNE_PASSED_DBS: "1"
        run: python -m pytest tests/acceptance -q --basetemp="${RUNNER_TEMP}/reference-additional" --junitxml=reference-additional.xml
      - name: Unchanged public Bitget reproducer
        env:
          PYTHONPATH: src
        run: >-
          python docs/audit/2026-10-28/issues/issue2-original.py
          --expected-version "$(python -c 'from steuerreport_v2 import __version__; print(__version__)')"
          > bitget-original-reference.json
      - name: Original reference results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mandatory-reference-results
          path: |
            reference-*.xml
            bitget-original-reference.json
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.11
          python -m pip install pytest-xdist==3.8.0
          python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Private account defaults
        run: python scripts/check_private_data_v2.py
      - name: Unit tests
        env:
          STEUERREPORT_TEST_PRUNE_PASSED_DBS: "1"
        run: >-
          pytest tests/unit -n 4 --dist loadfile -q
          --basetemp="${RUNNER_TEMP}/steuerreport-tests"
          -o tmp_path_retention_policy=all
          -o tmp_path_retention_count=1
      - name: OpenAPI contract drift
        run: python scripts/export_openapi_v2.py --check
      - name: Endpoint reference drift
        run: python scripts/generate_api_endpoint_reference_v2.py --check
      - name: Import documentation and empty templates drift
        run: python scripts/generate_import_format_docs_v2.py --check
      - name: AI usage guide drift
        run: python scripts/generate_ai_usage_guide_v2.py --check

  docker-layer-proof:
    name: Docker dependency layer reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build twice and validate isolated containers
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/docker-layer-proof"
          mkdir -p "$proof/a" "$proof/b"
          git archive HEAD | tar -x -C "$proof/a"
          cp -a "$proof/a/." "$proof/b/"
          printf '\n# synthetic cache proof\n' >> "$proof/b/src/steuerreport_v2/__init__.py"
          git -C "$proof/b" init -q
          git -C "$proof/b" add --force .
          GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
            git -C "$proof/b" -c user.name='Synthetic CI' -c user.email='synthetic@example.invalid' commit -q -m 'Synthetic source change'
          synthetic_revision="$(git -C "$proof/b" rev-parse HEAD)"
          python -c 'import json,sys; print(json.dumps({"baseline":sys.argv[1],"synthetic_revision":sys.argv[2],"synthetic":True}))' \
            "$GITHUB_SHA" "$synthetic_revision" > "$proof/source-context.json"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          container_a="sr-cache-a-$GITHUB_RUN_ID"
          container_b="sr-cache-b-$GITHUB_RUN_ID"
          cleanup() { docker rm --force --volumes "$container_a" "$container_b" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for suffix in a b; do
            revision="$GITHUB_SHA"
            if [ "$suffix" = b ]; then revision="$synthetic_revision"; fi
            docker build --progress=plain --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$revision" --label "org.opencontainers.image.version=$version" \
              --tag "sr-cache-proof:$suffix" "$proof/$suffix" > "$proof/build-$suffix.log" 2>&1
          done
          python scripts/check_docker_dependency_cache_v2.py "$proof/build-b.log" | tee "$proof/cache-proof.txt"
          for suffix in a b; do
            name="sr-cache-$suffix-$GITHUB_RUN_ID"
            revision="$GITHUB_SHA"
            if [ "$suffix" = b ]; then revision="$synthetic_revision"; fi
            docker image inspect "sr-cache-proof:$suffix" > "$proof/image-$suffix.raw.json"
            python scripts/container_release_v2.py verify --local --inspect "$proof/image-$suffix.raw.json" \
              --image "ghcr.io/$owner/steuerreport-v2" --version "$version" --sha "$revision" \
              --repository "$GITHUB_REPOSITORY" --output "$proof/image-$suffix.json"
            docker run --detach --name "$name" --read-only --network none --cap-drop ALL \
              --security-opt no-new-privileges:true --tmpfs /tmp:size=256m,mode=1777 \
              --mount type=volume,destination=/state "sr-cache-proof:$suffix"
            python scripts/container_release_v2.py smoke --container "$name" --version "$version" \
              --output "$proof/smoke-$suffix.json"
            python scripts/check_container_user_path_v2.py --container "$name" --version "$version" \
              --source-sha "$revision" --output "$proof/user-path-$suffix.json"
            docker exec "$name" python -c 'import json,urllib.request; payload=json.dumps({"connector_id":"binance","api_key":"synthetic-key","api_secret":"synthetic-secret"}).encode(); req=urllib.request.Request("http://127.0.0.1:8010/api/v1/admin/cex-credentials",data=payload,headers={"Content-Type":"application/json"},method="POST"); response=json.load(urllib.request.urlopen(req,timeout=30)); assert response["status"] == "ok"'
            volume="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/state"}}{{.Name}}{{end}}{{end}}' "$name")"
            [[ "$volume" =~ ^[a-f0-9]{64}$ ]]
            docker stop --time 30 "$name" >/dev/null
            first_key="$(docker run --rm -i --network none --read-only --entrypoint python \
              -e STEUERREPORT_SYNTHETIC_VAULT_PROOF=1 --mount "type=volume,source=$volume,destination=/state,readonly" \
              "sr-cache-proof:$suffix" - < scripts/check_vault_fixture_offline_v2.py)"
            docker start "$name" >/dev/null
            ready=0
            for attempt in $(seq 1 30); do
              if docker exec "$name" python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8010/health",timeout=3)' >/dev/null 2>&1; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1
            docker stop --time 30 "$name" >/dev/null
            second_key="$(docker run --rm -i --network none --read-only --entrypoint python \
              -e STEUERREPORT_SYNTHETIC_VAULT_PROOF=1 --mount "type=volume,source=$volume,destination=/state,readonly" \
              "sr-cache-proof:$suffix" - < scripts/check_vault_fixture_offline_v2.py)"
            test "$first_key" = "$second_key"
            printf 'synthetic encrypted vault and restart verified\n' > "$proof/vault-$suffix.txt"
            docker rm --force --volumes "$name" >/dev/null
          done
      - name: Archive sanitized layer proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-layer-proof
          path: |
            ${{ runner.temp }}/docker-layer-proof/cache-proof.txt
            ${{ runner.temp }}/docker-layer-proof/source-context.json
            ${{ runner.temp }}/docker-layer-proof/image-*.json
            !${{ runner.temp }}/docker-layer-proof/*.raw.json
            ${{ runner.temp }}/docker-layer-proof/smoke-*.json
            ${{ runner.temp }}/docker-layer-proof/user-path-*.json
            ${{ runner.temp }}/docker-layer-proof/vault-*.txt
          if-no-files-found: warn
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: URL state and exact amount checks
        working-directory: .
        run: |
          node scripts/check_workspace_state_v2.cjs
          TZ=Europe/Berlin node scripts/check_workspace_state_v2.cjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install isolated browser test tools
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Guided UX browser checks with synthetic data
        working-directory: .
        run: python scripts/check_ux_browser_v2.py
      - name: Manual correction routing and stale revision with synthetic data
        working-directory: .
        run: python scripts/check_issue17_manual_patch_browser_v2.py
      - name: Native MEXC file wizard with controlled synthetic responses
        working-directory: .
        run: python scripts/check_mexc_import_browser_v2.py --output "${RUNNER_TEMP}/mexc-import-browser"
      - name: Install backend for isolated review browser regression
        working-directory: .
        run: python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - name: MEXC file wizard against real isolated import backend
        working-directory: .
        run: python scripts/check_mexc_import_backend_browser_v2.py --output "${RUNNER_TEMP}/mexc-backend-browser"
      - name: Review context browser checks against actual isolated backend
        working-directory: .
        run: python scripts/check_review_backend_browser_v2.py
      - name: Lot-origin details with isolated backend and synthetic companion data
        working-directory: .
        run: python scripts/check_lot_origin_browser_v2.py --output "${RUNNER_TEMP}/lot-origin-browser"
      - name: Protected wallet setup against actual isolated backend
        working-directory: .
        run: python scripts/check_wallet_setup_browser_v2.py
      - name: Source history workflow with controlled provider responses
        working-directory: .
        run: python scripts/check_history_import_browser_v2.py
      - name: Source history approval against actual isolated backend
        working-directory: .
        run: python scripts/check_history_backend_browser_v2.py
      - name: History provider selection and detail fetch ETA with synthetic data
        working-directory: .
        run: python scripts/check_history_provider_eta_browser_v2.py --output "${RUNNER_TEMP}/history-provider-eta-browser"
      - name: Solana rate settings against isolated local coordinator
        working-directory: .
        run: python scripts/check_solana_limits_browser_v2.py --output "${RUNNER_TEMP}/solana-limits-browser"
      - name: Historical EUR prices against isolated backend and mock providers
        working-directory: .
        run: python scripts/check_historical_prices_browser_v2.py --output "${RUNNER_TEMP}/historical-prices-browser"
      - name: Update settings, selection and clipboard with controlled responses
        working-directory: .
        run: python scripts/check_updates_browser_v2.py --output "${RUNNER_TEMP}/updates-browser"
      - name: Update cooldown, persistence and pinned handoff against isolated backend
        working-directory: .
        run: python scripts/check_updates_backend_browser_v2.py --output "${RUNNER_TEMP}/updates-backend-browser"
      - name: UX browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-browser-evidence
          path: |
            artifacts/ux-browser/
            artifacts/ux-review-fixes/
            ${{ runner.temp }}/lot-origin-browser/
            artifacts/source-history-browser/
            artifacts/source-history-backend-browser/
            ${{ runner.temp }}/history-provider-eta-browser/
            ${{ runner.temp }}/solana-limits-browser/
            ${{ runner.temp }}/historical-prices-browser/
            ${{ runner.temp }}/updates-browser/
            ${{ runner.temp }}/updates-backend-browser/
            ${{ runner.temp }}/mexc-import-browser/
            ${{ runner.temp }}/mexc-backend-browser/
          if-no-files-found: ignore
