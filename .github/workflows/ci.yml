name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.11
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest tests/unit -q
      - name: OpenAPI contract drift
        run: python scripts/export_openapi_v2.py --check
      - name: Endpoint reference drift
        run: python scripts/generate_api_endpoint_reference_v2.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
